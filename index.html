function spawnHazard(kind, x, y, delay, extra) {
  const h = { kind, x, y, r: 12, t: delay || 1, max: delay || 1, life: 0, dmg: 2, tick: 0, style: (extra && extra.style) || '' };
  switch (kind) {
    case 'rock': h.r = 13; break;                                  // masso telegrafato dall'ombra
    case 'shock': h.t = h.max = 0.8; h.r = 0; h.maxR = (extra && extra.radius) || 84; break; // anello d'urto che si espande
    case 'geyser': h.t = h.max = delay || 0.8; h.r = 12; break;    // bollicine, poi colonna di vapore
    case 'tentacle': h.t = h.max = delay || 0.9; h.r = 14; break;  // crepe, poi tentacolo dal terreno
    case 'lavablob': h.t = h.max = delay || 0.9; h.r = 12; h.sx = extra.sx; h.sy = extra.sy; break; // lava in arco
    case 'poison': h.life = 4.5; h.max = 4.5; h.r = 10; h.dmg = 1; break;   // pozza di veleno
    case 'lavapool': h.life = 5.5; h.max = 5.5; h.r = 12; h.dmg = h.style === 'sauce' ? 1 : 2; break; // pozza di lava (o di salsa bollente)
    case 'steam': case 'tent_up': h.life = kind === 'steam' ? 0.55 : 0.6; h.max = h.life; break; // solo visivi
    case 'beam': h.t = h.max = delay || 0.7; h.ang = extra.ang; h.len = 240; break;          // raggio: linea di mira, poi raggio
    case 'beam_on': h.life = 0.35; h.max = 0.35; h.ang = extra.ang; h.len = 240; h.dmg = 2; break;
    case 'bomb': h.t = h.max = delay || 1; h.r = 13; break;                                  // bomba al plasma dal cielo
    case 'goo': h.life = 3.5; h.max = 3.5; h.r = 10; h.dmg = 1; break;                       // melma aliena
  }
  game.hazards.push(h);
}
// Distanza di un punto da un segmento (per i raggi laser)
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function hazardHitPlayer(h, dmg) { if (!player.dead && dist(h.x, h.y, player.x, player.y + 2) < h.r + 4) damagePlayer(dmg, h.x, h.y + 24); }
function updateHazards(dt) {
  const list = game.hazards, p = player;

    const h = list[i];

        if (Math.random() < dt * 4) spawnParticles(h.x + rnd(-h.r, h.r) * 0.7, h.y + rnd(-3, 3), { count: 1, colors: h.kind === 'poison' ? ['#7ee57e', '#3fbf3f'] : h.kind === 'goo' ? ['#c080ff', '#ff4fd8'] : ['#ffd84a', '#ff7a1a'], speed: 6, life: 0.5, size: 1, gravity: -25 });
      }
      if (h.kind === 'beam_on' && !p.dead) {
        const bx = h.x + Math.cos(h.ang) * h.len, by = h.y + Math.sin(h.ang) * h.len;
        if (segDist(p.x, p.y, h.x, h.y, bx, by) < 8) damagePlayer(h.dmg, p.x - Math.cos(h.ang) * 10, p.y - Math.sin(h.ang) * 10);

    }
    h.t -= dt;

        break;

        break;

}

function pickupItem(it) {
  const p = player; let label = '';
  switch (it.type) {
    case 'soy':
      p.ammo = Math.min(CFG.maxAmmo, p.ammo + ITEM_TYPES.soy.ammo); label = '+8 SALSA'; Sound.sfx('pickup'); break;
    case 'tuna':
      p.hp = Math.min(p.maxHp, p.hp + ITEM_TYPES.tuna.heal); label = 'TONNO XL!'; Sound.sfx('heal');
      spawnParticles(p.x, p.y - 6, { count: 16, colors: ['#e74c3c', '#f5b7b1', '#ffffff'], speed: 50, life: 0.7, size: 2, gravity: -40 });
      break;
    case 'ginger':
      p.hp = Math.min(p.maxHp, p.hp + ITEM_TYPES.ginger.heal); label = '+1 CUORE'; Sound.sfx('heal'); break;
    case 'wasabi':
      p.wasabi++; label = 'WASABI!'; Sound.sfx('pickup'); flags.seenWasabi = true;
      if (!flags.wasabiToast) { flags.wasabiToast = true; toast(Touch.enabled ? 'ABILITÀ: sputa Wasabi e confondi i nemici' : 'E: sputa Wasabi e confondi i nemici'); }
      break;
    case 'pistol':
      p.hasGun = true; p.ammo = Math.max(p.ammo, 14); label = 'PISTOLA!'; Sound.sfx('confirm');
      toast(Touch.enabled ? 'Tieni premuto ATTACCO per sparare salsa di soia' : 'SPAZIO o CLICK: spara salsa di soia (tieni premuto)');
      break;
    case 'razzo':
      p.razzi++; label = 'RAZZO RIMBALZO!'; Sound.sfx('pickup'); flags.seenRazzo = true;

      break;
    case 'chicco':
      startChiccoSequence('chicco'); return;
    case 'cuore':
      startChiccoSequence('cuore'); return;
  }
  if (label) addFloater(p.x, p.y - 14, label, '#ffffff');
  spawnParticles(it.x, it.y, { count: 8, colors: ['#ffffff', '#ffe066'], speed: 50, life: 0.4, size: 1, gravity: -30 });
}

// --- RICE POWER: ogni Chicco Supremo potenzia Giri in modo permanente ---
function startChiccoSequence(kind) {
  const p = player;
  p.frozen = true; p.moving = false; p.invuln = 0; p.hurt = 0; game.ending = true;
  let gains, title;
  if (kind === 'cuore') { // il frammento dello Chef completa il Cuore del Sushi Supremo
    p.ricePower = 5; p.supreme = true; p.hp = p.maxHp; p.ammo = CFG.maxAmmo;
    title = 'CUORE DEL SUSHI SUPREMO!';
    gains = ['RICE POWER COMPLETO', 'IL CUORE DEL SUSHI SUPREMO È TUO', 'GIRI È IMBATTIBILE (QUASI)', 'GLI ALTRI SUSHI SONO LIBERI'];
  } else {
    p.ricePower = Math.min(5, p.ricePower + 1);
    gains = ['RICE POWER +1']; title = 'CHICCO DEL RISO SUPREMO!';
    p.maxHp += 2; p.hp = p.maxHp; gains.push('VITA MASSIMA +1 CUORE');
    if (p.gunLevel < 4) { p.gunLevel++; gains.push(GUN_NAMES[p.gunLevel] + ': ' + GUN_DESC[p.gunLevel]); }
    p.speed += 4; gains.push('VELOCITÀ AUMENTATA');
    p.ammo = CFG.maxAmmo; gains.push('SALSA DI SOIA AL MASSIMO');
  }
  game.powerup = { t: 0, gains, title, kind: kind || 'chicco' };
  game.state = 'POWERUP';
  game.cam.shake = 3;
  Sound.sfx('chicco');
  spawnParticles(p.x, p.y - 6, { count: 40, colors: ['#ffd84a', '#fff2b0', '#ffffff', '#f28b4b'], speed: 90, life: 1.2, size: 2, gravity: -30 });
}
// Fine della schermata: dialogo con Onigiri e vittoria del mondo
function endChiccoSequence() {
  game.state = 'PLAYING'; game.powerup = null;
  Sound.sfx('powerup'); Music.play(game.map.music);
  const endId = game.map.endDialogue || 'risaia_end';
  const npc = game.npcs.find(n => n.type === 'onigiri');
  if (npc) { // Onigiri raggiunge Giri (su un tile libero)
    npc.talked = true;
    if (!solidAtPoint(player.x + 22, player.y)) { npc.x = player.x + 22; npc.y = player.y; }
    else if (!solidAtPoint(player.x - 22, player.y)) { npc.x = player.x - 22; npc.y = player.y; }

  startOnigiriDialogue(npc || { x: player.x + 1, y: player.y, dialogue: endId }, endId);
}

function updateNPCs(dt) {
  for (const n of game.npcs) {
    n.anim += dt;
    if (n.type !== 'onigiri') continue;
    if (!n.talked && !player.dead && dist(n.x, n.y, player.x, player.y) < 26 && game.fade.dir === 0) {
      n.talked = true; flags['dlg_' + n.dialogue] = true; startOnigiriDialogue(n, n.dialogue);
    }
    // Durante lo scontro con l'orso, Onigiri lancia bottigliette di salsa quando Giri è a secco
    if (n.support && n.talked && !player.dead) {
      const boss = game.enemies.find(e => e.boss && !e.dead && !e.dying && e.state !== 'sleep');
      n.throwT -= dt;
      if (boss && n.throwT <= 0 && player.ammo < 8 && !game.items.some(it => it.type === 'soy')) {
        n.throwT = 6;
        let tx = player.x, ty = player.y;
        for (let k = 0; k < 8; k++) { const cx = player.x + rnd(-36, 36), cy = player.y + rnd(-28, 28); if (!solidAtPoint(cx, cy)) { tx = cx; ty = cy; break; } }
        throwItem('soy', n.x, n.y - 10, tx, ty);
        addFloater(n.x, n.y - 24, 'PRENDI!', '#ffffff'); Sound.sfx('throw');
      }
      if (boss && n.supportRazzo) { // e nel parco anche i Razzi Rimbalzo
        n.razzoT -= dt;
        if (n.razzoT <= 0 && player.razzi <= 0 && !game.items.some(it => it.type === 'razzo')) {
          n.razzoT = 9;
          let tx = player.x, ty = player.y;
          for (let k = 0; k < 8; k++) { const cx = player.x + rnd(-36, 36), cy = player.y + rnd(-28, 28); if (!solidAtPoint(cx, cy)) { tx = cx; ty = cy; break; } }
          throwItem('razzo', n.x, n.y - 10, tx, ty);
          addFloater(n.x, n.y - 24, 'RAZZO!', '#8fd3ff'); Sound.sfx('throw');
        }
      }
      if (boss && !n.gaveGinger && player.hp <= 3) {
        n.gaveGinger = true;
        throwItem('ginger', n.x, n.y - 10, player.x + rnd(-20, 20), player.y + rnd(-16, 16));
        addFloater(n.x, n.y - 24, 'RESISTI!', '#f2b8c6'); Sound.sfx('throw');
      }
    }
  }
}

// 16. PARTICELLE, NUMERI DI DANNO, TOAST
// ---------------------------------------------------------------------------
function spawnParticles(x, y, o) {
  const n = o.count || 5;
  for (let i = 0; i < n; i++) {
    if (game.particles.length >= CFG.maxParticles) game.particles.shift();
    const a = rnd(0, Math.PI * 2), s = rnd(0.3, 1) * (o.speed || 40);
    const life = (o.life || 0.4) * rnd(0.6, 1.2);
    game.particles.push({ x, y, vx: Math.cos(a) * s + (o.vx || 0), vy: Math.sin(a) * s + (o.vy || 0), life, maxLife: life, color: pick(o.colors || ['#ffffff']), size: o.size || 2, gravity: o.gravity || 0 });
  }
}
function updateParticles(dt) {
  const list = game.particles;
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i];
    p.life -= dt;
    if (p.life <= 0) { list.splice(i, 1); continue; }
    p.vy += p.gravity * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98;
  }
}
function drawParticles(c, ox, oy) {
  for (const p of game.particles) {
    const s = Math.max(1, Math.round(p.size * (p.life / p.maxLife)));
    c.fillStyle = p.color;
    c.fillRect(Math.round(p.x - ox - s / 2), Math.round(p.y - oy - s / 2), s, s);
  }
}
function addFloater(x, y, text, color) { game.floaters.push({ x, y, text, color, life: 0.9 }); }
function updateFloaters(dt) {
  for (let i = game.floaters.length - 1; i >= 0; i--) { const f = game.floaters[i]; f.life -= dt; f.y -= 22 * dt; if (f.life <= 0) game.floaters.splice(i, 1); }
}
function drawFloaters(c, ox, oy) {
  for (const f of game.floaters) { if (f.life < 0.3 && Math.floor(f.life * 20) % 2 === 0) continue; drawTextShadow(c, f.text, f.x - ox, f.y - oy, f.color, '#000000', 1, 'center'); }
}
function toast(text, dur = 2.8) { game.toasts.push({ text, life: dur }); }
function updateToasts(dt) { if (game.toasts.length) { game.toasts[0].life -= dt; if (game.toasts[0].life <= 0) game.toasts.shift(); } }
function drawToasts(c) {
  if (!game.toasts.length || game.state === 'DIALOGUE') return;
  const t = game.toasts[0];
  const lines = wrapText(t.text, 52);
  const w = Math.max(...lines.map(l => textWidth(l))) + 10, h = lines.length * 10 + 6;

// Giri, il nigiri. o = {facing, anim, moving, dash, hurt, hasGun, recoil, angry, sleepy, sweat, dead}
function drawGiri(c, x, y, o) {
  const f = o.facing || { x: 0, y: 1 };
  const hop = o.moving ? Math.round(Math.abs(Math.sin(o.anim * 14)) * 2) : 0;
  const so = (!o.moving && !o.dash && Math.sin(o.anim * 2.5) > 0.6) ? 1 : 0; // il salmone "respira"
  const rx = o.recoil > 0 ? -Math.round(f.x) : 0, ry = o.recoil > 0 ? -Math.round(f.y) : 0;
  if (!o.noShadow) shadowBlob(c, x, y, 6, 2);
  c.save();
  c.translate(Math.round(x + rx), Math.round(y - hop + ry));
  if (o.dash) { c.translate(0, -5); c.scale(1 + 0.35 * Math.abs(f.x), 1 + 0.35 * Math.abs(f.y)); c.translate(0, 5); }
  const rice = o.supreme ? '#ffe88a' : '#f7f3e8', grain = o.supreme ? '#e0b020' : '#dcd6c6';
  if (o.supreme) { c.globalAlpha = 0.22 + 0.1 * Math.sin(o.anim * 6); blob(c, 0, -6, 12, 10, '#ffd84a'); c.globalAlpha = 1; }
  // riso (arrotondato)

  fillR(c, -4, -4, 1, 1, grain); fillR(c, 0, -6, 1, 1, grain); fillR(c, 3, -3, 1, 1, grain); fillR(c, -2, -2, 1, 1, grain);
  // salmone
  fillR(c, -7 + so, -12, 14, 4, o.supreme ? '#ff9a4b' : '#f28b4b');
  fillR(c, -6 + so, -12, 12, 1, o.supreme ? '#ffc08a' : '#f6a06c');
  fillR(c, -7 + so, -9, 14, 1, '#d9743a');
  if (o.supreme && !o.dead) { const sp = Math.floor(o.anim * 8) % 3; fillR(c, -8 + sp * 7, -15 - (sp % 2), 1, 1, '#fff8d0'); fillR(c, 6 - sp * 4, -14 + (sp % 2), 1, 1, '#ffd84a'); }
  const st = '#f9b98f';
  fillR(c, -5 + so, -12, 1, 1, st); fillR(c, -4 + so, -11, 1, 1, st); fillR(c, -3 + so, -10, 1, 1, st);
  fillR(c, 1 + so, -12, 1, 1, st); fillR(c, 2 + so, -11, 1, 1, st); fillR(c, 3 + so, -10, 1, 1, st);
  // occhi
  const ex = Math.round(f.x), ey = f.y < -0.3 ? -1 : 0;
  const blink = !o.dead && !o.sleepy && ((o.anim % 3.7) < 0.1);
  const eyeCol = '#1a1a1a';
  if (o.dead) {
    [[-4, 0], [-2, 0], [-3, 1], [-4, 2], [-2, 2], [1, 0], [3, 0], [2, 1], [1, 2], [3, 2]].forEach(p => fillR(c, p[0], -7 + p[1], 1, 1, eyeCol));
  } else if (blink || o.sleepy) {

  } else if (o.hurt) {
    fillR(c, -4 + ex, -6 + ey, 3, 1, eyeCol); fillR(c, 1 + ex, -6 + ey, 3, 1, eyeCol);
  } else {
    fillR(c, -3 + ex, -6 + ey, 2, 2, eyeCol); fillR(c, 1 + ex, -6 + ey, 2, 2, eyeCol);
    fillR(c, -3 + ex, -6 + ey, 1, 1, '#ffffff'); fillR(c, 1 + ex, -6 + ey, 1, 1, '#ffffff');
  }
  if (o.angry && !o.dead) { fillR(c, -3 + ex, -8 + ey, 1, 1, eyeCol); fillR(c, -2 + ex, -7 + ey, 1, 1, eyeCol); fillR(c, 2 + ex, -8 + ey, 1, 1, eyeCol); fillR(c, 1 + ex, -7 + ey, 1, 1, eyeCol); }
  // bocca
  if (o.hurt || o.dead) fillR(c, -1 + ex, -4, 2, 2, '#c0392b');
  else if (o.recoil > 0) fillR(c, -1 + ex, -3, 2, 1, '#c0392b');

  // pistola alla salsa di soia
  if (o.hasGun && !o.dead) {
    const gx = Math.round(f.x * 6), gy = -5 + Math.round(f.y * 2);
    const gun = '#4a4a58', grip = '#8b5a2b', tank = '#3b2314';
    if (Math.abs(f.x) >= Math.abs(f.y)) {

      fillR(c, gx + (dir > 0 ? -1 : -3), gy, 5, 2, gun); fillR(c, gx + (dir > 0 ? 0 : 0), gy + 2, 2, 2, grip); fillR(c, gx - 1, gy - 2, 2, 2, tank);

      if (o.recoil > 0.05) fillR(c, gx - 1, gy + (dir > 0 ? 4 : -5), 3, 2, '#fff8d0');
    }
  }

}

function drawProjectile(c, pr, ox, oy) {
  const x = Math.round(pr.x - ox), y = Math.round(pr.y - oy);
  const l = Math.hypot(pr.vx, pr.vy) || 1, ux = pr.vx / l, uy = pr.vy / l;
  switch (pr.kind) {
    case 'soy':
      if (pr.supreme) { fillR(c, x - Math.round(ux * 3) - 1, y - Math.round(uy * 3) - 1, 2, 2, '#e0b020'); blob(c, x, y, 3, 3, '#ffd84a'); fillR(c, x - 1, y - 1, 1, 1, '#fff8d0'); break; }
      fillR(c, x - Math.round(ux * 3) - 1, y - Math.round(uy * 3) - 1, 2, 2, '#3b2314');
      fillR(c, x - 1, y - 1, 3, 3, '#5a3418'); fillR(c, x - 1, y - 1, 1, 1, '#8a5a30');
      break;
    case 'knife': // lama che gira nel verso del lancio
      c.save(); c.translate(x, y); c.rotate(Math.atan2(uy, ux) + (pr.anim || 0) * 14);
      c.fillStyle = pr.reflected ? '#8fd3ff' : '#c0c0d0'; c.fillRect(-5, -1, 7, 2); c.fillStyle = '#5a3a1e'; c.fillRect(2, -1, 3, 2); c.fillStyle = '#ffffff'; c.fillRect(-4, -1, 4, 1);
      c.restore();
      break;
    case 'plate': { // piatto che gira
      const fl = Math.floor((pr.anim || 0) * 10) % 2;
      blob(c, x, y, 5, 5 - fl, pr.reflected ? '#8fd3ff' : '#dcdce6'); blob(c, x, y, 3, 3 - fl, '#ffffff'); fillR(c, x - 3 + fl * 2, y - 1, 2, 1, '#c0392b');
      break;
    }
    case 'wasabi':
      blob(c, x, y, 3, 3, '#3f8f33'); blob(c, x, y, 2, 2, '#7ee57e'); fillR(c, x - 1, y - 2, 1, 1, '#c8ffb0');
      break;
    case 'chopstick':
      c.save(); c.translate(x, y); c.rotate(Math.atan2(uy, ux));
      c.fillStyle = '#c99a5f'; c.fillRect(-4, -2, 8, 1); c.fillStyle = '#b0803f'; c.fillRect(-4, 1, 8, 1);
      c.restore();
      break;
    case 'fire': { // palla di fuoco con coda tremolante
      const fl = Math.floor((pr.anim || 0) * 20) % 2;
      fillR(c, x - Math.round(ux * 5) - 1, y - Math.round(uy * 5) - 1, 2, 2, '#c0392b');
      blob(c, x, y, 3 + fl, 3, '#ff7a1a'); blob(c, x, y, 2, 2 - fl, '#ffd84a'); fillR(c, x, y - 1, 1, 1, '#fff8d0');
      break;
    }
    case 'bullet':

      fillR(c, x - Math.round(ux * 3), y - Math.round(uy * 3), 1, 1, '#c9b24a');

    case 'laser': { // segmento luminoso lungo la direzione (ciano se rimbalzato)
      const a = pr.reflected ? '#5aa9ff' : '#ff4fd8', b = pr.reflected ? '#d0ecff' : '#ffd0f4';
      for (let i = -3; i <= 3; i++) fillR(c, x + Math.round(ux * i) - 1, y + Math.round(uy * i) - 1, 2, 2, a);
      for (let i = -2; i <= 2; i++) fillR(c, x + Math.round(ux * i), y + Math.round(uy * i), 1, 1, b);

  lines: [], idx: 0, shown: 0, t: 0, onEnd: null, blipT: 0, wrapped: [], full: 0,
  start(lines, onEnd) {
    this.lines = lines; this.idx = 0; this.onEnd = onEnd; this.prep();
    // niente lampeggio o colpi in sospeso durante il dialogo
    player.invuln = 0; player.hurt = 0; player.recoil = 0; player.dashT = 0; player.razzoT = 0;
    game.projectiles = game.projectiles.filter(pr => pr.owner === 'player');
    game.state = 'DIALOGUE';
  },
  cur() { return this.lines[this.idx]; },
  prep() { const ln = this.cur(); this.shown = 0; this.t = 0; this.blipT = 0; this.wrapped = ln ? wrapText(ln.text, 52) : []; this.full = this.wrapped.join(' ').length; },
  update(dt) {
    if (this.shown >= this.full) return;
    this.t += dt * CFG.typeSpeed;
    const n = Math.min(this.full, Math.floor(this.t));
    if (n > this.shown) { this.shown = n; this.blipT -= 1; if (this.blipT <= 0) { Sound.sfx('blip'); this.blipT = 3; } }
  },
  advance() {
    if (!this.cur()) return;
    if (this.shown < this.full) { this.shown = this.full; this.t = this.full; return; }
    this.idx++;
    if (this.idx >= this.lines.length) {
      game.state = 'PLAYING'; Input.down.attack = false;
      const cb = this.onEnd; this.onEnd = null; if (cb) cb();
    } else { this.prep(); Sound.sfx('blip'); }
  },
  draw(c) {
    const ln = this.cur(); if (!ln) return;
    const bx = 6, by = VH - 64, bw = VW - 12, bh = 58;
    c.fillStyle = 'rgba(10,10,20,0.92)'; c.fillRect(bx, by, bw, bh);
    c.fillStyle = '#ffd84a'; c.fillRect(bx, by, bw, 1); c.fillRect(bx, by + bh - 1, bw, 1); c.fillRect(bx, by, 1, bh); c.fillRect(bx + bw - 1, by, 1, bh);
    c.fillStyle = '#1c1c2c'; c.fillRect(bx + 4, by + 4, 40, 40);
    c.fillStyle = '#44445a'; c.fillRect(bx + 4, by + 4, 40, 1); c.fillRect(bx + 4, by + 43, 40, 1); c.fillRect(bx + 4, by + 4, 1, 40); c.fillRect(bx + 43, by + 4, 1, 40);
    const talking = this.shown < this.full;
    if (ln.who === 'onigiri') drawOnigiriPortrait(c, bx + 24, by + 24, talking); else if (ln.who === 'chef') drawChefPortrait(c, bx + 24, by + 24, talking); else drawGiriPortrait(c, bx + 24, by + 24, talking);
    drawText(c, ln.who === 'onigiri' ? 'ONIGIRI' : ln.who === 'chef' ? 'CHEF' : 'GIRI', bx + 24, by + 47, ln.who === 'chef' ? '#ff6b6b' : '#ffd84a', 1, 'center');
    // testo rivelato progressivamente, riga per riga
    let left = this.shown;
    for (let i = 0; i < this.wrapped.length && left > 0; i++) {
      const l = this.wrapped[i];
      drawText(c, l.slice(0, left), bx + 50, by + 8 + i * 11, '#f0ece0');
      left -= l.length + 1;
    }
    if (!talking && Math.sin(game.time * 6) > 0) {
      const ax = bx + bw - 10, ay = by + bh - 8;
      c.fillStyle = '#ffd84a'; c.fillRect(ax - 3, ay - 3, 7, 1); c.fillRect(ax - 2, ay - 2, 5, 1); c.fillRect(ax - 1, ay - 1, 3, 1); c.fillRect(ax, ay, 1, 1);
    }
  }
};

const HEART = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
function drawHeart(c, x, y, mode) {
  for (let r = 0; r < 6; r++) for (let i = 0; i < 7; i++) {
    if (HEART[r][i] !== '#') continue;
    let col = '#4a1a22';
    if (mode === 'full' || (mode === 'half' && i <= 3)) col = (r === 1 && (i === 1 || (mode === 'full' && i === 5))) ? '#ff8a9a' : '#e8303f';
    c.fillStyle = col; c.fillRect(x + i, y + r, 1, 1);
  }
}
function drawButton(c, label, x, y, w, h, hot) {
  c.fillStyle = 'rgba(0,0,0,0.55)'; c.fillRect(x, y, w, h);
  c.fillStyle = hot ? '#ffe066' : '#ffffff';
  c.fillRect(x, y, w, 1); c.fillRect(x, y + h - 1, w, 1); c.fillRect(x, y, 1, h); c.fillRect(x + w - 1, y, 1, h);
  drawText(c, label, x + w / 2, y + Math.floor((h - 7) / 2), '#ffffff', 1, 'center');
}
function tapIn(x, y, w, h) { const t = Input.tap; return !!t && t.x >= x && t.x <= x + w && t.y >= y && t.y <= y + h; }
// Dove punta la freccia dell'obiettivo: Onigiri non ancora incontrato, oppure la meta della mappa
function objectiveTarget() {
  const npc = game.npcs.find(n => n.type === 'onigiri' && !n.talked);
  if (npc) return { x: npc.x, y: npc.y };
  const m = game.map;
  if (m && m.goal && (!m.goalFlag || flags[m.goalFlag])) return { x: tileCX(m.goal.x), y: tileCY(m.goal.y) };
  const chicco = game.items.find(it => it.type === 'chicco' || it.type === 'cuore');
  if (chicco) return { x: chicco.x, y: chicco.y };
  return null;
}

function drawHUD(c) {

  const dr = 1 - p.dashCd / CFG.dashCd;

  }
  // scritta grande (nome del boss)
  if (game.banner && game.banner.t > 0) {
    const a = Math.min(1, game.banner.t);

    drawText(c, txt, VW / 2, 33, '#ffd84a', 1, 'center');
    c.globalAlpha = 1;
  }
  // freccia verso l'obiettivo (Onigiri, oppure la meta della mappa) quando è fuori schermo
  const target = objectiveTarget();
  if (target) {
    const sx = target.x - game.cam.x, sy = target.y - game.cam.y;
    if (sx < -8 || sx > VW + 8 || sy < -8 || sy > VH + 8) {
      const cx = VW / 2, cy = VH / 2, dx = sx - cx, dy = sy - cy;
      const t = Math.min((VW / 2 - 14) / Math.abs(dx || 0.001), (VH / 2 - 14) / Math.abs(dy || 0.001));
      const ax = Math.round(cx + dx * t), ay = Math.round(cy + dy * t);

      c.restore();
    }
  }
}

    const x = VW / 2 - 29 + i * 12, on = i < player.ricePower, fresh = on && i === player.ricePower - 1 && Math.sin(t * 8) > 0;
    fillR(c, x, by + 70, 10, 10, on ? (fresh ? '#fff2b0' : '#ffd84a') : '#3a3220');
    if (on) fillR(c, x + 2, by + 72, 3, 3, '#fff8d0');
  }
  // potenziamenti, uno alla volta
  pu.gains.forEach((g, i) => {
    if (t < 0.9 + i * 0.35) return;
    drawText(c, '+ ' + g, bx + 14, by + 88 + i * 11, i === 0 ? '#ffd84a' : '#f0ece0');
  });
  if (t > 1.6 && Math.sin(t * 6) > 0) drawText(c, Touch.enabled ? 'TOCCA PER CONTINUARE' : 'SPAZIO PER CONTINUARE', VW / 2, by + bh + 8, '#9a9ab8', 1, 'center');
}
// Vittoria di fine mondo: scena, titolo e righe dipendono dal mondo completato
const VICTORIES = {
  risaia: {
    scene: (c, t) => drawTravelScene(c, t, true), title: 'MONDO 1 COMPLETATO',
    lines: ['IL PRIMO CHICCO SUPREMO È DI GIRI.', 'IL GRANDE ORSO DELLA RISAIA DORMIRÀ A LUNGO.'],
    next: ['PROSSIMA TAPPA: L\'ISOLA DEL VULCANO.'],
  },
  vulcano: {
    scene: (c, t) => drawSeaScene(c, t, true), title: 'MONDO 2 COMPLETATO',
    lines: ['TAKO INFERNO È TORNATO A BOLLIRE IN PACE.', 'IL SECONDO CHICCO SUPREMO È DI GIRI.'],
    next: ['PROSSIMA TAPPA: LA CITTÀ. MA QUALCOSA, LASSÙ,', 'STA ARRIVANDO...'],
  },
  invasa: {
    scene: (c, t) => drawNightScene(c, t, true), title: 'MONDO 3 COMPLETATO',
    lines: ['L\'IMPERATORE GNAM-ZOR È TORNATO A CASA SENZA CENA.', 'IL TERZO CHICCO SUPREMO È DI GIRI.'],
    next: ['ULTIMA TAPPA: IL RISTORANTE KARAGUASHI,', 'NELLA PROSSIMA VERSIONE DI RICE POWER.'],
  },
};
function drawVictory(c) {
  const t = game.titleTime;
  if (game.victory === 'finale') { drawEnding(c, t); return; }
  const v = VICTORIES[game.victory] || VICTORIES.risaia;
  v.scene(c, t);
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, 0, VW, 112);
  drawTextShadow(c, v.title, VW / 2, 10, '#ffffff', '#c0392b', 2, 'center');
  v.lines.forEach((ln, i) => drawText(c, ln, VW / 2, 34 + i * 10, '#f0ece0', 1, 'center'));
  v.next.forEach((ln, i) => drawText(c, ln, VW / 2, 60 + i * 10, '#ffd84a', 1, 'center'));
  drawText(c, 'NEMICI SCONFITTI: ' + game.kills + '   TEMPO: ' + fmtTime(game.playTime), VW / 2, 86, '#f0ece0', 1, 'center');
  // i Chicchi raccolti brillano in alto
  for (let i = 0; i < player.ricePower; i++) drawItem(c, 'chicco', 22 + i * 18, 30 + Math.round(Math.sin(t * 3 + i) * 2));
  drawButton(c, 'RICOMINCIA', VW / 2 - 40, 192, 80, 16, Math.sin(t * 5) > 0);
}

// ---------------------------------------------------------------------------
// 21. UPDATE
// ---------------------------------------------------------------------------
function updateCamera(dt, snap) {
  const map = game.map; if (!map) return;
  const mw = map.w * TILE, mh = map.h * TILE;
  let fx = player.x, fy = player.y;
  const boss = game.enemies.find(e => e.boss && !e.dead && e.state !== 'sleep');
  if (boss && boss.def.stationary) { fx = lerp(player.x, boss.x, 0.4); fy = lerp(player.y, boss.y, 0.4); }
  else if (boss) { fx = lerp(player.x, boss.x, 0.25); fy = lerp(player.y, boss.y, 0.25); }
  let tx = clamp(fx - VW / 2, 0, Math.max(0, mw - VW));
  let ty = clamp(fy - VH / 2, 0, Math.max(0, mh - VH));
  if (mw < VW) tx = (mw - VW) / 2; if (mh < VH) ty = (mh - VH) / 2;
  if (snap) { game.cam.x = tx; game.cam.y = ty; }
  else { const k = 1 - Math.exp(-CFG.cameraLerp * dt); game.cam.x += (tx - game.cam.x) * k; game.cam.y += (ty - game.cam.y) * k; }
  game.cam.shake = Math.max(0, game.cam.shake - dt * 12);
}

// Atmosfera: fumo dal cratere, braci sopra il lago di lava
function updateAmbient(dt) {
  const am = game.map && game.map.ambient; if (!am) return;
  if (am.kind === 'smoke' && Math.random() < dt * 5) spawnParticles(am.x + rnd(-10, 10), am.y, { count: 1, colors: ['#5a5a66', '#8a8a96', '#3a3038'], speed: 6, life: 2.6, size: 3, gravity: -16 });
  if (am.kind === 'embers' && Math.random() < dt * 10) spawnParticles(rnd(am.x0, am.x1), rnd(am.y0, am.y1), { count: 1, colors: ['#ff7a1a', '#ffd84a', '#ffb347'], speed: 5, life: 1.6, size: 1, gravity: -22 });
  if (am.kind === 'fires') for (const sp of am.spots) { if (Math.abs(sp[0] - game.cam.x - VW / 2) > VW || Math.abs(sp[1] - game.cam.y - VH / 2) > VH) continue; if (Math.random() < dt * 7) spawnParticles(sp[0] + rnd(-6, 6), sp[1], { count: 1, colors: ['#ff7a1a', '#ffd84a', '#5a5a66', '#3a3038'], speed: 6, life: rnd(0.5, 1.6), size: 2, gravity: -28 }); }
}
function updatePlaying(dt) {
  if (Input.justPressed('pause') && !player.dead && !game.ending) { game.state = 'PAUSED'; Sound.sfx('blip'); return; }
  if (game.hitStop > 0) { game.hitStop -= dt; return; } // micro pausa d'impatto
  game.playTime += dt;
  if (game.objective.t > 0) game.objective.t -= dt;
  if (game.tutT > 0) {
    game.tutT -= dt;
    if (game.tutT <= 0 && !flags.moveToast) { flags.moveToast = true; toast(Touch.enabled ? 'Usa la LEVETTA per muoverti' : 'FRECCE o WASD per muoverti'); }
  }
  updatePlayer(dt);
  for (const e of game.enemies) { if (e.dead) continue; if (e.dying) updateDying(e, dt); else updateEnemy(e, dt); }
  separateEnemies();
  if (game.enemies.some(e => e.dead)) game.enemies = game.enemies.filter(e => !e.dead);
  updateProjectiles(dt);
  updateHazards(dt); updateGeysers(dt); updateAmbient(dt);
  updateItems(dt); updatePrisoners(dt);
  updateNPCs(dt);
  updateParticles(dt); updateFloaters(dt); updateToasts(dt);
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  updateCamera(dt, false);
  if (player.dead) { game.deathTimer -= dt; if (game.deathTimer <= 0) game.state = 'GAME_OVER'; }
}

function update(dt) {
  game.time += dt;
  Music.update();
  if (Input.justPressed('mute')) { Sound.toggleMute(); toast('Audio ' + (Sound.muted ? 'disattivato' : 'attivato'), 1.2); }
  if (Input.justPressed('fullscreen')) Fullscreen.toggle();
  switch (game.state) {
    case 'TITLE':
      game.titleTime += dt;
      if (confirmPressed() || Input.tap) { newGame(); startStory(STORY_INTRO, startGame); }
      break;
    case 'STORY': {
      game.storyTimer += dt;
      const story = game.story, s = story[game.storyIndex], full = s.lines.join('\n').length;
      const done = game.storyTimer * CFG.typeSpeed >= full;
      if (Input.justPressed('pause')) { startFade(game.storyNext); game.state = 'FADE_TO_GAME'; break; }
      if (confirmPressed() || Input.tap) {
        if (!done) game.storyTimer = full / CFG.typeSpeed + 0.01;
        else if (game.storyIndex < story.length - 1) { game.storyIndex++; game.storyTimer = 0; Sound.sfx('blip'); }
        else { startFade(game.storyNext); game.state = 'FADE_TO_GAME'; Sound.sfx('confirm'); }
      } else if (done && game.storyTimer * CFG.typeSpeed > full + 5 * CFG.typeSpeed && game.storyIndex < story.length - 1) {
        game.storyIndex++; game.storyTimer = 0;
      }
      break;
    }
    case 'FADE_TO_GAME': game.storyTimer += dt; break;
    case 'PLAYING': updatePlaying(dt); break;
    case 'POWERUP':
      game.powerup.t += dt;
      updateParticles(dt); updateFloaters(dt);
      player.anim += dt;
      if (game.powerup.t > 1.6 && (confirmPressed() || Input.tap)) endChiccoSequence();
      break;
    case 'DIALOGUE':
      Dialogue.update(dt);
      updateParticles(dt); updateFloaters(dt);
      for (const n of game.npcs) n.anim += dt;
      player.anim += dt;
      if (confirmPressed()) Dialogue.advance();
      break;
    case 'PAUSED':
      if (Input.justPressed('pause')) { game.state = 'PLAYING'; Sound.sfx('blip'); }
      if (Input.justPressed('title') || tapIn(VW / 2 - 56, 176, 112, 16)) toTitle();
      break;
    case 'GAME_OVER':
      if (confirmPressed() || Input.tap) { Sound.sfx('confirm'); retry(); }
      if (Input.justPressed('title')) toTitle();
      break;
    case 'VICTORY':
      game.titleTime += dt;
      if (game.victory === 'finale') { if (game.titleTime > 1 && game.titleTime < 9 && (confirmPressed() || Input.tap)) game.titleTime = 9; else if (game.titleTime > 11 && (confirmPressed() || Input.tap)) toTitle(); }
      else if (game.titleTime > 1 && (confirmPressed() || Input.tap)) toTitle();
      break;
  }
  updateFade(dt);
  // durante la micro-pausa d'impatto gli input premuti non vanno persi
  Input.endFrame(game.state === 'PLAYING' && game.hitStop > 0);
}

// ---------------------------------------------------------------------------
// 22. RENDER
// ---------------------------------------------------------------------------
function drawWorld(c) {
  const map = game.map; if (!map || !map.canvas) return;
  const sh = game.cam.shake;
  const ox = clamp(Math.round(game.cam.x + (sh > 0 ? rnd(-sh, sh) : 0)), 0, map.w * TILE - VW);
  const oy = clamp(Math.round(game.cam.y + (sh > 0 ? rnd(-sh, sh) : 0)), 0, map.h * TILE - VH);
  c.drawImage(map.canvas, ox, oy, VW, VH, 0, 0, VW, VH);
  drawHazards(c, ox, oy);
  // ombre dei volatili (a terra, sotto a tutto)
  for (const e of game.enemies) if (isFlying(e) && !e.dead) shadowBlob(c, Math.round(e.x - ox), Math.round(e.y + e.h / 2 - oy), e.boss ? 14 : 4, e.boss ? 3 : 1);
  // entità ordinate per profondità (y dei piedi)
  const list = [];
  for (const it of game.items) {
    list.push({ y: it.y + 5, f: () => {
      const b = Math.round(Math.sin(it.anim * 4) * 1.5), x = Math.round(it.x - ox), y = Math.round(it.y + 5 - oy), air = Math.round(it.air || 0);
      shadowBlob(c, x, y, it.type === 'chicco' || it.type === 'cuore' ? 6 : 4, 1); drawItem(c, it.type, x, y - 2 - b - air);
    } });
  }
  for (const n of game.npcs) list.push({ y: n.y + n.h / 2, f: () => drawNPC(c, n, Math.round(n.x - ox), Math.round(n.y + n.h / 2 - oy)) });
  for (const pr of game.prisoners) list.push({ y: pr.y + 4, f: () => drawPrisoner(c, pr, Math.round(pr.x - ox), Math.round(pr.y + 4 - oy)) });
  for (const e of game.enemies) list.push({ y: e.y + e.h / 2 + (isFlying(e) ? 1000 : 0), f: () => drawEnemy(c, e, Math.round(e.x - ox), Math.round(e.y + e.h / 2 - oy)) });
  list.push({ y: player.y + player.h / 2, f: () => {
    if (player.dead) return;
    if (game.state === 'PLAYING' && player.invuln > 0 && player.dashT <= 0 && Math.floor(player.invuln * 14) % 2 === 0) return;
    drawGiri(c, Math.round(player.x - ox), Math.round(player.y + player.h / 2 - oy), {
      facing: player.facing, anim: player.anim, moving: player.moving, dash: player.dashT > 0,
      hurt: player.hurt > 0, hasGun: player.hasGun, recoil: player.recoil, supreme: player.supreme,
    });
    if (player.razzoT > 0) drawRazzoBarrier(c, ox, oy);
  } });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.f();
  for (const pr of game.projectiles) drawProjectile(c, pr, ox, oy);
  drawParticles(c, ox, oy);
  drawFloaters(c, ox, oy);
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  switch (game.state) {
    case 'TITLE': drawTitle(ctx); break;
    case 'STORY': case 'FADE_TO_GAME': drawStory(ctx); break;
    case 'VICTORY': drawVictory(ctx); break;
    case 'PLAYING': case 'DIALOGUE': case 'PAUSED': case 'GAME_OVER': case 'POWERUP':
      drawWorld(ctx);
      if (game.state === 'POWERUP') { drawPowerup(ctx); break; }
      drawHUD(ctx);
      drawToasts(ctx);
      if (game.state === 'DIALOGUE') Dialogue.draw(ctx);
      if (game.state === 'PAUSED') drawPause(ctx);
      if (game.state === 'GAME_OVER') drawGameOver(ctx);
      break;
  }
  if (game.fade.alpha > 0) { ctx.globalAlpha = game.fade.alpha; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------------------
// 23. GAME LOOP E AVVIO
// ---------------------------------------------------------------------------
function resize() {
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  const si = Math.floor(s);
  const scale = (si >= 1 && si / s >= 0.8) ? si : s; // preferisci scala intera se non si perde troppo spazio
  canvas.style.width = Math.floor(VW * scale) + 'px';
  canvas.style.height = Math.floor(VH * scale) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

function init() {
  for (const k in MAPS) { finalizeMap(MAPS[k]); prerenderMap(MAPS[k]); }
  Touch.init();
  Fullscreen.init();
  resize();
  newGame();
  game.state = 'TITLE';
  Music.play('title');
}

let lastTime = performance.now();
let loopErrors = 0;
function loop(now) {
  requestAnimationFrame(loop); // prenota subito il frame successivo: un errore non può più bloccare il gioco
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (!(dt > 0)) dt = 0;        // il primo timestamp di rAF può essere precedente a performance.now()
  if (dt > 0.05) dt = 0.05;     // evita salti dopo un cambio di scheda
  try { update(dt); } catch (err) { recoverFromError(err); }
  try { render(); } catch (err) { recoverFromError(err); }
}
// Rete di sicurezza: se qualcosa va storto in un frame, ripulisce lo stato
// "pericoloso" invece di congelare la partita.
function recoverFromError(err) {
  loopErrors++;
  if (loopErrors < 20) console.error('[Rice Power] errore recuperato:', err);
  try {
    if (!isFinite(game.hitStop)) game.hitStop = 0;
    game.hazards = (game.hazards || []).filter(h => isFinite(h.x) && isFinite(h.y));
    game.projectiles = (game.projectiles || []).filter(pr => isFinite(pr.x) && isFinite(pr.y));
    for (const e of game.enemies || []) {
      if (!isFinite(e.x) || !isFinite(e.y)) { e.x = e.homeX || TILE * 4; e.y = e.homeY || TILE * 4; }
      if (e.boss && e.hidden && !e.dying) { e.hidden = false; e.state = 'idle'; e.cd = 0.6; }
    }
    if (player && (!isFinite(player.x) || !isFinite(player.y)) && game.map && game.map.spawn) { player.x = tileCX(game.map.spawn.x); player.y = tileCY(game.map.spawn.y); }
    Input.pressed = {};
  } catch (e2) { /* non c'è altro da fare: il frame successivo riprova */ }
}
init();
requestAnimationFrame(loop);

// PWA: registra il service worker solo quando la pagina è servita da un sito (non da file://)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Hook per debug/test (non influisce sul gioco)
window.__RP = { game, Input, update, render, startStory, startGame, startRisaia, startVulcano, startInvasa, startFinale, loadMap, retry, MAPS, getPlayer: () => player, Dialogue, flags: () => flags, makeEnemy, damageEnemy, damagePlayer, spawnHazard, pickupItem, spawnItem, activateSupreme, STORY_INTRO, STORY_RISAIA, STORY_VULCANO, STORY_INVASA, STORY_FINALE };
</script>
