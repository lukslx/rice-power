  const rows = Touch.enabled
    ? [['LEVETTA', 'MUOVITI'], ['ATTACCO', 'SPARA (TIENI PREMUTO)'], ['SCHIVATA', 'SCATTO INVULNERABILE'], ['ABILITÀ', 'SPUTA WASABI']]
    : [['FRECCE / WASD', 'MUOVITI'], ['SPAZIO / CLICK', 'SPARA (TIENI PREMUTO)'], ['SHIFT', 'SCHIVATA'], ['E', 'SPUTA WASABI'], ['ESC', 'PAUSA'], ['M', 'AUDIO ON/OFF']];
  rows.forEach((r, i) => { drawText(c, r[0], 110, 70 + i * 12, '#ffd84a', 1, 'right'); drawText(c, r[1], 122, 70 + i * 12, '#f0ece0'); });
  drawText(c, Touch.enabled ? 'TOCCA II PER CONTINUARE' : 'ESC: CONTINUA   T: TORNA AL TITOLO', VW / 2, 160, '#9a9ab8', 1, 'center');
  if (Touch.enabled) drawButton(c, 'TORNA AL TITOLO', VW / 2 - 56, 176, 112, 16, false);
}
function drawGameOver(c) {
  c.fillStyle = 'rgba(20,0,0,0.7)'; c.fillRect(0, 0, VW, VH);
  drawTextShadow(c, 'GIRI È FINITO NEL PIATTO', VW / 2, 56, '#ffffff', '#c0392b', 2, 'center');
  drawText(c, 'NEMICI SCONFITTI: ' + game.kills, VW / 2, 92, '#f0ece0', 1, 'center');
  drawButton(c, 'RIPROVA', VW / 2 - 34, 116, 68, 16, Math.sin(game.time * 5) > 0);
  drawText(c, Touch.enabled ? 'TOCCA PER RIPROVARE' : 'SPAZIO: RIPROVA   T: TITOLO', VW / 2, 142, '#9a9ab8', 1, 'center');
}
function drawVictory(c) {
  const t = game.titleTime;
  drawNightSky(c, t);
  c.fillStyle = '#2f6b2f'; c.fillRect(0, 120, VW, VH - 120); c.fillStyle = '#3f8a3c'; c.fillRect(0, 120, VW, 3);
  for (let i = 0; i < 40; i++) { c.fillStyle = '#357733'; c.fillRect((hash2(i, 21) * VW) | 0, 126 + ((hash2(i, 23) * 86) | 0), 2, 1); }
  // fontana e siepi
  blob(c, 300, 162, 26, 9, '#9b9bad'); blob(c, 300, 160, 22, 7, '#2f6fd6'); blob(c, 300, 158, 6, 6, '#9b9bad');
  for (let i = 0; i < 4; i++) { const sy = 148 - Math.abs(Math.sin(t * 4 + i)) * 10; c.fillStyle = '#d6ebff'; c.fillRect(296 + i * 3, Math.round(sy), 1, 2); }
  c.fillStyle = '#2b6b2b'; c.fillRect(0, 112, VW, 10); c.fillStyle = '#3c8a3c'; for (let i = 0; i < 48; i++) c.fillRect(i * 8 + ((hash2(i, 3) * 5) | 0), 113 + ((hash2(i, 5) * 6) | 0), 2, 1);
  // Giri e Onigiri
  c.save(); c.translate(170, 170); c.scale(2, 2); drawGiri(c, 0, 0, { facing: { x: 1, y: 0 }, anim: t, moving: false }); c.restore();
  c.save(); c.translate(220, 170); c.scale(2, 2); drawOnigiri(c, 0, 0, { anim: t, talking: false }); c.restore();
  drawTextShadow(c, 'PROLOGO COMPLETATO', VW / 2, 16, '#ffffff', '#c0392b', 2, 'center');
  drawText(c, 'GIRI HA RAGGIUNTO ONIGIRI.', VW / 2, 40, '#f0ece0', 1, 'center');
  drawText(c, 'IL VIAGGIO VERSO LA RISAIA DI MONTAGNA', VW / 2, 54, '#ffd84a', 1, 'center');
  drawText(c, 'CONTINUA NELLA PROSSIMA VERSIONE DI RICE POWER.', VW / 2, 64, '#ffd84a', 1, 'center');
  drawText(c, 'NEMICI SCONFITTI: ' + game.kills + '   TEMPO: ' + fmtTime(game.playTime), VW / 2, 80, '#f0ece0', 1, 'center');
  drawButton(c, 'RICOMINCIA', VW / 2 - 40, 94, 80, 16, Math.sin(t * 5) > 0);
}

// ---------------------------------------------------------------------------
// 21. UPDATE
// ---------------------------------------------------------------------------
function updateCamera(dt, snap) {
  const map = game.map; if (!map) return;
  const mw = map.w * TILE, mh = map.h * TILE;
  let tx = clamp(player.x - VW / 2, 0, Math.max(0, mw - VW));
  let ty = clamp(player.y - VH / 2, 0, Math.max(0, mh - VH));
  if (mw < VW) tx = (mw - VW) / 2; if (mh < VH) ty = (mh - VH) / 2;
  if (snap) { game.cam.x = tx; game.cam.y = ty; }
  else { const k = 1 - Math.exp(-CFG.cameraLerp * dt); game.cam.x += (tx - game.cam.x) * k; game.cam.y += (ty - game.cam.y) * k; }
  game.cam.shake = Math.max(0, game.cam.shake - dt * 12);
}

function updatePlaying(dt) {
  if (Input.justPressed('pause') && !player.dead && !game.ending) { game.state = 'PAUSED'; Sound.sfx('blip'); return; }
  if (game.hitStop > 0) { game.hitStop -= dt; return; } // micro pausa d'impatto
  game.playTime += dt;
  if (game.objective.t > 0) game.objective.t -= dt;
  if (game.tutT > 0) {
    game.tutT -= dt;
    if (game.tutT <= 0 && !flags.moveToast) { flags.moveToast = true; toast(Touch.enabled ? 'Usa la LEVETTA per muoverti' : 'FRECCE o WASD per muoverti'); }
  }
  updatePlayer(dt);
  for (const e of game.enemies) if (!e.dead) updateEnemy(e, dt);
  separateEnemies();
  if (game.enemies.some(e => e.dead)) game.enemies = game.enemies.filter(e => !e.dead);
  updateProjectiles(dt);
  updateItems(dt);
  updateNPCs(dt);
  updateParticles(dt); updateFloaters(dt); updateToasts(dt);
  updateCamera(dt, false);
  if (player.dead) { game.deathTimer -= dt; if (game.deathTimer <= 0) game.state = 'GAME_OVER'; }
}

function update(dt) {
  game.time += dt;
  Music.update();
  if (Input.justPressed('mute')) { Sound.toggleMute(); toast('Audio ' + (Sound.muted ? 'disattivato' : 'attivato'), 1.2); }
  if (Input.justPressed('fullscreen')) Fullscreen.toggle();
  switch (game.state) {
    case 'TITLE':
      game.titleTime += dt;
      if (confirmPressed() || Input.tap) startStory();
      break;
    case 'STORY': {
      game.storyTimer += dt;
      const s = STORY[game.storyIndex], full = s.lines.join('\n').length;
      const done = game.storyTimer * CFG.typeSpeed >= full;
      if (Input.justPressed('pause')) { startFade(startGame); game.state = 'FADE_TO_GAME'; break; }
      if (confirmPressed() || Input.tap) {
        if (!done) game.storyTimer = full / CFG.typeSpeed + 0.01;
        else if (game.storyIndex < STORY.length - 1) { game.storyIndex++; game.storyTimer = 0; Sound.sfx('blip'); }
        else { startFade(startGame); game.state = 'FADE_TO_GAME'; Sound.sfx('confirm'); }
      } else if (done && game.storyTimer * CFG.typeSpeed > full + 5 * CFG.typeSpeed && game.storyIndex < STORY.length - 1) {
        game.storyIndex++; game.storyTimer = 0;
      }
      break;
    }
    case 'FADE_TO_GAME': game.storyTimer += dt; break;
    case 'PLAYING': updatePlaying(dt); break;
    case 'DIALOGUE':
      Dialogue.update(dt);
      updateParticles(dt); updateFloaters(dt);
      for (const n of game.npcs) n.anim += dt;
      player.anim += dt;
      if (confirmPressed()) Dialogue.advance();
      break;
    case 'PAUSED':
      if (Input.justPressed('pause')) { game.state = 'PLAYING'; Sound.sfx('blip'); }
      if (Input.justPressed('title') || tapIn(VW / 2 - 56, 176, 112, 16)) toTitle();
      break;
    case 'GAME_OVER':
      if (confirmPressed() || Input.tap) { Sound.sfx('confirm'); retry(); }
      if (Input.justPressed('title')) toTitle();
      break;
    case 'VICTORY':
      game.titleTime += dt;
      if (game.titleTime > 1 && (confirmPressed() || Input.tap)) toTitle();
      break;
  }
  updateFade(dt);
  // durante la micro-pausa d'impatto gli input premuti non vanno persi
  Input.endFrame(game.state === 'PLAYING' && game.hitStop > 0);
}

// ---------------------------------------------------------------------------
// 22. RENDER
// ---------------------------------------------------------------------------
function drawWorld(c) {
  const map = game.map; if (!map || !map.canvas) return;
  const sh = game.cam.shake;
  const ox = clamp(Math.round(game.cam.x + (sh > 0 ? rnd(-sh, sh) : 0)), 0, map.w * TILE - VW);
  const oy = clamp(Math.round(game.cam.y + (sh > 0 ? rnd(-sh, sh) : 0)), 0, map.h * TILE - VH);
  c.drawImage(map.canvas, ox, oy, VW, VH, 0, 0, VW, VH);
  // ombre dei volatili (a terra, sotto a tutto)
  for (const e of game.enemies) if (e.def.behavior === 'flyer') shadowBlob(c, Math.round(e.x - ox), Math.round(e.y + e.h / 2 - oy), 4, 1);
  // entità ordinate per profondità (y dei piedi)
  const list = [];
  for (const it of game.items) {
    list.push({ y: it.y + 5, f: () => {
      const b = Math.round(Math.sin(it.anim * 4) * 1.5), x = Math.round(it.x - ox), y = Math.round(it.y + 5 - oy);
      shadowBlob(c, x, y, 4, 1); drawItem(c, it.type, x, y - 2 - b);
    } });
  }
  for (const n of game.npcs) list.push({ y: n.y + n.h / 2, f: () => drawNPC(c, n, Math.round(n.x - ox), Math.round(n.y + n.h / 2 - oy)) });
  for (const e of game.enemies) list.push({ y: e.y + e.h / 2 + (e.def.behavior === 'flyer' ? 1000 : 0), f: () => drawEnemy(c, e, Math.round(e.x - ox), Math.round(e.y + e.h / 2 - oy)) });
  list.push({ y: player.y + player.h / 2, f: () => {
    if (player.dead) return;
    if (game.state === 'PLAYING' && player.invuln > 0 && player.dashT <= 0 && Math.floor(player.invuln * 14) % 2 === 0) return;
    drawGiri(c, Math.round(player.x - ox), Math.round(player.y + player.h / 2 - oy), {
      facing: player.facing, anim: player.anim, moving: player.moving, dash: player.dashT > 0,
      hurt: player.hurt > 0, hasGun: player.hasGun, recoil: player.recoil,
    });
  } });
  list.sort((a, b) => a.y - b.y);
  for (const d of list) d.f();
  for (const pr of game.projectiles) drawProjectile(c, pr, ox, oy);
  drawParticles(c, ox, oy);
  drawFloaters(c, ox, oy);
}

function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  switch (game.state) {
    case 'TITLE': drawTitle(ctx); break;
    case 'STORY': case 'FADE_TO_GAME': drawStory(ctx); break;
    case 'VICTORY': drawVictory(ctx); break;
    case 'PLAYING': case 'DIALOGUE': case 'PAUSED': case 'GAME_OVER':
      drawWorld(ctx);
      drawHUD(ctx);
      drawToasts(ctx);
      if (game.state === 'DIALOGUE') Dialogue.draw(ctx);
      if (game.state === 'PAUSED') drawPause(ctx);
      if (game.state === 'GAME_OVER') drawGameOver(ctx);
      break;
  }
  if (game.fade.alpha > 0) { ctx.globalAlpha = game.fade.alpha; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
}

// ---------------------------------------------------------------------------
// 23. GAME LOOP E AVVIO
// ---------------------------------------------------------------------------
function resize() {
  const s = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  const si = Math.floor(s);
  const scale = (si >= 1 && si / s >= 0.8) ? si : s; // preferisci scala intera se non si perde troppo spazio
  canvas.style.width = Math.floor(VW * scale) + 'px';
  canvas.style.height = Math.floor(VH * scale) + 'px';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

function init() {
  for (const k in MAPS) { finalizeMap(MAPS[k]); prerenderMap(MAPS[k]); }
  Touch.init();
  Fullscreen.init();
  resize();
  newGame();
  game.state = 'TITLE';
  Music.play('title');
}

let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000; lastTime = now;
  if (dt > 0.05) dt = 0.05; // evita salti dopo un cambio di scheda
  update(dt);
  render();
  requestAnimationFrame(loop);
}
init();
requestAnimationFrame(loop);

// PWA: registra il service worker solo quando la pagina è servita da un sito (non da file://)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Hook per debug/test (non influisce sul gioco)
window.__RP = { game, Input, update, render, startStory, startGame, loadMap, retry, MAPS, getPlayer: () => player, Dialogue, flags: () => flags };
</script>
